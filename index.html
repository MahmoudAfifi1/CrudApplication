<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css">
    <title>CRUD By Afifi</title>
</head>
<body style="color: white; background-color: #1d2630;">
    <div class="container mt-5">
        <div class="text-center">
            <h1 class="display-5 mb-5"><strong>CRUD Application By Afifi</strong></h1>
        </div>
        <div class="main row justify-content-center">
            <!-- Form Section -->
            <form action="" id="student-form" class="row g-3 justify-content-center" autocomplete="off">
                <div class="col-12 col-md-8">
                    <label for="firstName" class="form-label">First Name</label>
                    <input class="form-control" type="text" id="firstName" placeholder="Enter First Name">
                </div>
                <div class="col-12 col-md-8">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input class="form-control" type="text" id="lastName" placeholder="Enter Last Name">
                </div>
                <div class="col-12 col-md-8">
                    <label for="rollNo" class="form-label">Roll No</label>
                    <input class="form-control" type="text" id="rollNo" placeholder="Enter Roll No.">
                </div>
                <div class="col-12 col-md-8">
                    <input type="submit" value="Submit" class="btn btn-success w-100">
                </div>
            </form>
            <!-- Table Section -->
            <div class="col-12 col-md-10 mt-5">
                <div class="table-responsive">
                    <table class="table table-striped table-dark">
                        <thead>
                            <tr>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Roll No</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="student-list">
                            <tr>
                                <td>Dear</td>
                                <td>Progx</td>
                                <td>25</td>
                                <td>
                                    <a href="#" class="btn btn-warning btn-sm edit">Edit</a>
                                    <a href="#" class="btn btn-danger btn-sm delete">Delete</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="jss.js"></script>
</body>
</html>
